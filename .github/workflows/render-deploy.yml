name: Deploy to DEV with Status

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render DEV
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Trigger Render Deployment
        id: trigger
        run: |
          echo "Triggering Render deployment..."
          RESPONSE=$(curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Response: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.deploy.id')
          echo "Deploy ID: $DEPLOY_ID"
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

      - name: Wait for Deployment to Complete
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"
          SERVICE_ID="srv-d6lneu75gffc73b0avk0"
          echo "Polling deployment status for: $DEPLOY_ID"
          MAX_RETRIES=40
          SLEEP_SECONDS=30

          for i in $(seq 1 $MAX_RETRIES); do
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID")

            echo "Raw response: $RESPONSE"
            STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')
            echo "Attempt $i: Deploy status = $STATUS"

            case "$STATUS" in
              live)
                echo "Deployment is live!"
                exit 0
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;
            esac

            echo "Waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

          echo "Timed out waiting for deployment after $((MAX_RETRIES * SLEEP_SECONDS / 60)) minutes."
          exit 1
